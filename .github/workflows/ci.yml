name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret / private-data scan (tracked files)
        run: node scripts/secret-scan.js --tracked
      - name: Tests (fake data only, no secrets required)
        run: npm test
